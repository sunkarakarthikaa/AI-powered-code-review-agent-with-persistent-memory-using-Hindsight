server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that isn't a real file gets index.html, so
    # client-side routing (if added later) doesn't 404 on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}