services:
  mongo:
    image: mongo:7
    container_name: pr-guardian-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: pr-guardian-backend
    ports:
      - "8080:8080"
    environment:
      # Note the hostname here is "mongo" — the docker-compose service name,
      # not "localhost". Inside the compose network, containers reach each
      # other by service name, not by the host machine's loopback address.
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/pr_guardian
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: pr-guardian-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data: